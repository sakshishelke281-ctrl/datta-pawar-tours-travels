<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard | Datta Pawar Tours & Travels</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #0f172a;
        }

        .header {
            background: #0b1f3a;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .header p {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 28px;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 21px;
        }

        .refresh-btn {
            border: none;
            background: #0b1f3a;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 13px;
            font-size: 13px;
            color: #475569;
        }

        td {
            padding: 13px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            vertical-align: top;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .confirmed {
            background: #dcfce7;
            color: #166534;
        }

        .completed {
            background: #dbeafe;
            color: #1e40af;
        }

        .cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-select {
            padding: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 12px;
            }

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div>
        <h1>Datta Pawar Tours & Travels</h1>
        <p>Owner Dashboard</p>
    </div>

    <a href="index.html" class="back-btn">
        ← Back to Website
    </a>
</header>


<main class="container">

    <section class="stats">

        <div class="stat-card">
            <h3>Total Bookings</h3>
            <strong id="totalBookings">0</strong>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <strong id="pendingBookings">0</strong>
        </div>

        <div class="stat-card">
            <h3>Confirmed</h3>
            <strong id="confirmedBookings">0</strong>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <strong id="completedBookings">0</strong>
        </div>

        <div class="stat-card">
            <h3>Cancelled</h3>
            <strong id="cancelledBookings">0</strong>
        </div>

    </section>


    <section class="table-box">

        <div class="table-header">
            <h2>Customer Bookings</h2>

            <button class="refresh-btn" onclick="loadBookings()">
                ↻ Refresh
            </button>
        </div>

        <div id="loading" class="loading">
            Loading bookings...
        </div>

        <div id="empty" class="empty" style="display:none;">
            No bookings found.
        </div>

        <table id="bookingTable" style="display:none;">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Mobile</th>
                    <th>Pickup</th>
                    <th>Drop</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Vehicle</th>
                    <th>Passengers</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="bookingBody"></tbody>

        </table>

    </section>

</main>


<script>

async function loadBookings() {

    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const table = document.getElementById("bookingTable");
    const body = document.getElementById("bookingBody");

    loading.style.display = "block";
    empty.style.display = "none";
    table.style.display = "none";

    try {

        const response = await fetch("/api/bookings");

        if (!response.ok) {
            throw new Error("Failed to load bookings");
        }

        const bookings = await response.json();

        body.innerHTML = "";

        updateStats(bookings);

        if (!bookings || bookings.length === 0) {

            loading.style.display = "none";
            empty.style.display = "block";

            return;
        }

        bookings.forEach(booking => {

            const row = document.createElement("tr");

            const status = booking.status || "Pending";

            row.innerHTML = `
                <td>#${booking.id}</td>

                <td>
                    <strong>${escapeHTML(booking.customer_name || "")}</strong>
                </td>

                <td>
                    ${escapeHTML(booking.mobile || "")}
                </td>

                <td>
                    ${escapeHTML(booking.pickup || "")}
                </td>

                <td>
                    ${escapeHTML(booking.drop_location || booking.drop || "")}
                </td>

                <td>
                    ${escapeHTML(booking.travel_date || "")}
                </td>

                <td>
                    ${escapeHTML(booking.travel_time || "")}
                </td>

                <td>
                    ${escapeHTML(booking.vehicle || "")}
                </td>

                <td>
                    ${escapeHTML(String(booking.passengers || ""))}
                </td>

                <td>

                    <select
                        class="status-select"
                        onchange="changeStatus(${booking.id}, this.value)"
                    >

                        <option value="Pending" ${status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Confirmed" ${status === "Confirmed" ? "selected" : ""}>
                            Confirmed
                        </option>

                        <option value="Completed" ${status === "Completed" ? "selected" : ""}>
                            Completed
                        </option>

                        <option value="Cancelled" ${status === "Cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </td>
            `;

            body.appendChild(row);

        });

        loading.style.display = "none";
        table.style.display = "table";

    } catch (error) {

        loading.innerHTML =
            "Unable to load bookings. Please check Flask server.";

        console.error(error);
    }
}


function updateStats(bookings) {

    let pending = 0;
    let confirmed = 0;
    let completed = 0;
    let cancelled = 0;

    bookings.forEach(booking => {

        const status = booking.status || "Pending";

        if (status === "Pending") {
            pending++;
        }

        if (status === "Confirmed") {
            confirmed++;
        }

        if (status === "Completed") {
            completed++;
        }

        if (status === "Cancelled") {
            cancelled++;
        }

    });

    document.getElementById("totalBookings").textContent = bookings.length;
    document.getElementById("pendingBookings").textContent = pending;
    document.getElementById("confirmedBookings").textContent = confirmed;
    document.getElementById("completedBookings").textContent = completed;
    document.getElementById("cancelledBookings").textContent = cancelled;
}


async function changeStatus(id, status) {

    try {

        const response = await fetch(`/api/bookings/${id}/status`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                status: status
            })

        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Status update failed");
        }

        alert("Booking status updated successfully!");

        loadBookings();

    } catch (error) {

        alert("Unable to update booking status.");

        console.error(error);
    }
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadBookings();

</script>

</body>
</html>
