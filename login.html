<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login | Datta Pawar Tours & Travels</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1f3a;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #0b1f3a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #0b1f3a;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0b1f3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #163b68;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #dc2626;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b1f3a;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            Datta Pawar Tours & Travels
        </div>

        <div class="subtitle">
            Owner Dashboard Login
        </div>

        <form id="loginForm">

            <label for="password">
                Owner Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter owner password"
                required
            >

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <div id="message"></div>

        <a href="/" class="back-link">
            ← Back to Website
        </a>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password = passwordInput.value;

            message.textContent = "Logging in...";

            try {

                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    window.location.href = "/dashboard.html";

                } else {

                    message.textContent = data.message || "Invalid password";

                    passwordInput.value = "";

                }

            } catch (error) {

                message.textContent =
                    "Something went wrong. Please try again.";

            }

        });

    </script>

</body>
</html>
